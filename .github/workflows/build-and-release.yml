name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'
      - '.gitignore'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[build]') ||
        contains(github.event.head_commit.message, '[release]') ||
        github.event_name == 'workflow_dispatch'
      )
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract version
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" =~ ^v?[0-9] ]]; then
            VERSION=$(echo "$TAG_NAME" | sed -E 's/^[^0-9]*//')
          else
            VERSION="2.0.5"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run build tool
        run: |
          python build_tool/builder_cli.py --target both --name MeikovaHarvest --version ${{ env.VERSION }} --company Meikova --description "Meikova Harvest" --copyright "© 2026 Meikova"

      - name: Rename Web Binary for platform identification
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/MeikovaHarvest-Web-${{ env.VERSION }}.exe dist/MeikovaHarvest-Web-${{ env.VERSION }}-Windows.exe || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv dist/MeikovaHarvest-Web-${{ env.VERSION }} dist/MeikovaHarvest-Web-${{ env.VERSION }}-macOS || true
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mv dist/MeikovaHarvest-Web-${{ env.VERSION }} dist/MeikovaHarvest-Web-${{ env.VERSION }}-Linux || true
          fi

      - name: Upload build assets directly to Private Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.5' }}
          files: |
            dist/MeikovaHarvest*
            dist_electron/*.exe
            dist_electron/*.msi
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.pkg
            dist_electron/*.AppImage
            dist_electron/*.tar.gz
            dist_electron/*.deb
            dist_electron/*.rpm
          fail_on_unmatched_files: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        shell: bash
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.5' }}"
          VERSION=$(echo "$TAG_NAME" | sed -E 's/^[^0-9]*//')
          echo "TARGET_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all assets from Private Release
        run: |
          mkdir -p all_assets
          gh release download ${{ env.TARGET_TAG }} --dir all_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Debug: list downloaded files"
        run: |
          echo "=== Files in all_assets/ ==="
          ls -lah ./all_assets/

      - name: Calculate SHA-256 & Generate Release Notes
        shell: bash
        run: |
          TAG_MSG=$(git tag -l -n99 ${{ env.TARGET_TAG }} | sed "s/^${{ env.TARGET_TAG }} //g" | sed 's/^[ \t]*//')
          if [ -z "$TAG_MSG" ] || [ "$TAG_MSG" = "Release ${{ env.TARGET_TAG }}" ] || [ "$TAG_MSG" = "${{ env.TARGET_TAG }}" ]; then
            TAG_MSG=$(git log -1 --pretty=format:"%B")
          fi
          
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ env.TARGET_TAG }}^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..${{ env.TARGET_TAG }} --pretty=format:"* %s (%h)")
          else
            CHANGELOG=$(git log -n 15 --pretty=format:"* %s (%h)")
          fi
          
          cat <<EOF > release_notes.md
          # Meikova Harvest ${{ env.TARGET_TAG }}
          
          Giai phap tai da phuong tien toan nang, ho tro da nen tang (Windows, macOS, Linux), bao mat ma nguon va phat hanh tu dong.
          
          ### Chi tiet phat hanh (Release Message):
          $TAG_MSG
          
          ### Nhat ky thay doi (What's Changed):
          $CHANGELOG
          
          ### Thong tin cac tap tin phat hanh (Assets Info):
          #### Windows:
          * **MeikovaHarvest-Setup-${{ env.VERSION }}.exe**: Ban cai dat NSIS day du ho tro go cai dat.
          * **MeikovaHarvest-Portable-${{ env.VERSION }}.exe**: Ban di dong (Portable), chay truc tiep khong can cai dat.
          * **MeikovaHarvest-${{ env.VERSION }}.msi**: Ban cai dat Windows Installer (MSI).
          * **MeikovaHarvest-${{ env.VERSION }}-win.zip**: Ban nen ZIP cho Windows.
          #### macOS:
          * **MeikovaHarvest-${{ env.VERSION }}.dmg**: Ban cai dat Disk Image cho macOS.
          * **MeikovaHarvest-${{ env.VERSION }}-mac.zip**: Ban nen ZIP cho macOS.
          * **MeikovaHarvest-${{ env.VERSION }}.pkg**: Ban cai dat Package Installer cho macOS.
          #### Linux:
          * **MeikovaHarvest-${{ env.VERSION }}.AppImage**: Ban di dong cho Linux, chay truc tiep.
          * **MeikovaHarvest-${{ env.VERSION }}.tar.gz**: Ban nen Archive cho Linux.
          * **MeikovaHarvest-${{ env.VERSION }}.deb**: Ban cai dat cho Ubuntu/Debian.
          * **MeikovaHarvest-${{ env.VERSION }}.rpm**: Ban cai dat cho Fedora/RHEL/CentOS.
          #### Web Binary (Standalone Server):
          * **MeikovaHarvest-Web-${{ env.VERSION }}-<Platform>**: Ban Web Binary doc lap chay tren tung he dieu hanh.
          
          ### Ma bam bao mat (SHA-256 Checksums):
          | File Asset | SHA-256 Checksum |
          |---|---|
          EOF

          cd all_assets
          for file in *; do
            if [ -f "$file" ]; then
              hash=$(sha256sum "$file" | awk '{print $1}')
              echo "| \`$file\` | \`${hash}\` |" >> ../release_notes.md
            fi
          done
          cd ..

          cat <<EOF >> release_notes.md
          
          ---
          > **Luu y**: Do ma nguon duoc bao ve bang cac thuat toan xao tron code va dong goi nhi phan (PyArmor), mot so phan mem diet virus co the canh bao nham (False Positive). Vui long bo qua hoac them tep vao danh sach ngoai le de su dung on dinh.
          EOF

      - name: Update Private Release Notes with SHA-256 Checksums
        run: |
          gh release edit ${{ env.TARGET_TAG }} --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean existing assets (Public Repo)
        shell: bash
        run: |
          echo "Listing assets in public repo for tag ${{ env.TARGET_TAG }}..."
          assets=$(gh release view ${{ env.TARGET_TAG }} --repo Meikova/meikova-harvest-tool --json assets --jq '.assets[].name' 2>/dev/null || true)
          for asset in $assets; do
            echo "Deleting asset: $asset"
            gh release delete-asset ${{ env.TARGET_TAG }} "$asset" --repo Meikova/meikova-harvest-tool -y
          done
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Create GitHub Release and Upload Assets (To Public Repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: Meikova/meikova-harvest-tool
          tag_name: ${{ env.TARGET_TAG }}
          token: ${{ secrets.RELEASE_TOKEN }}
          body_path: release_notes.md
          files: |
            all_assets/*
          draft: false
          prerelease: false

      - name: Update update.json in Public Repo
        shell: bash
        run: |
          git clone https://x-token-auth:${{ secrets.RELEASE_TOKEN }}@github.com/Meikova/meikova-harvest-tool.git public_repo
          cd public_repo
          
          cat <<EOF > update.json
          {
            "version": "${{ env.VERSION }}",
            "url": "https://github.com/Meikova/meikova-harvest-tool/releases/download/${{ env.TARGET_TAG }}/MeikovaHarvest-Setup-${{ env.VERSION }}.exe",
            "platforms": {
              "win32": "https://github.com/Meikova/meikova-harvest-tool/releases/download/${{ env.TARGET_TAG }}/MeikovaHarvest-Setup-${{ env.VERSION }}.exe",
              "darwin_arm64": "https://github.com/Meikova/meikova-harvest-tool/releases/download/${{ env.TARGET_TAG }}/MeikovaHarvest-${{ env.VERSION }}-arm64.dmg",
              "darwin_x64": "https://github.com/Meikova/meikova-harvest-tool/releases/download/${{ env.TARGET_TAG }}/MeikovaHarvest-${{ env.VERSION }}-x64.dmg",
              "linux_x64": "https://github.com/Meikova/meikova-harvest-tool/releases/download/${{ env.TARGET_TAG }}/MeikovaHarvest-${{ env.VERSION }}-x64.AppImage"
            },
            "changelog": "Phien ban moi nhat ${{ env.TARGET_TAG }} da duoc phat hanh tu dong. Chi tiet xem tai muc Releases tren GitHub."
          }
          EOF
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update update.json to ${{ env.TARGET_TAG }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
