name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract version from tag
        shell: bash
        run: |
          TAG_NAME=${{ github.ref_name }}
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run build tool
        run: |
          python build_tool/builder_cli.py --target both --name EveryThingDownloader --version ${{ env.VERSION }} --obfuscate

      # =========================================================================
      # ĐẨY FILE EXE ĐÃ BUILD SANG KHO LƯU TRỮ RIÊNG TƯ (PRIVATE REPOSITORY)
      # =========================================================================
      - name: Create GitHub Release and Upload Assets (To Private Repo)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EveryThingDownloader.exe
            dist_electron/EveryThingDownloader-Portable-${{ env.VERSION }}.exe
            dist_electron/EveryThingDownloader Setup ${{ env.VERSION }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # ĐẨY FILE EXE ĐÃ BUILD SANG KHO LƯU TRỮ CÔNG KHAI (PUBLIC REPOSITORY)
      # =========================================================================
      - name: Create GitHub Release and Upload Assets (To Public Repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: m3iK18dp/EveryThingDownloader-Tool # Kho lưu trữ công khai của bạn
          token: ${{ secrets.RELEASE_TOKEN }}           # PAT cấu hình trong Secrets của Private Repo
          files: |
            dist/EveryThingDownloader.exe
            dist_electron/EveryThingDownloader-Portable-${{ env.VERSION }}.exe
            dist_electron/EveryThingDownloader Setup ${{ env.VERSION }}.exe
          draft: false
          prerelease: false

      # =========================================================================
      # CẬP NHẬT FILE update.json TRÊN KHO LƯU TRỮ CÔNG KHAI (PUBLIC REPOSITORY)
      # =========================================================================
      - name: Update update.json in Public Repo
        shell: bash
        run: |
          # 1. Clone repo công khai về thư mục tạm bằng PAT
          git clone https://x-token-auth:${{ secrets.RELEASE_TOKEN }}@github.com/m3iK18dp/EveryThingDownloader-Tool.git public_repo
          cd public_repo
          
          # 2. Ghi đè file update.json với thông tin mới nhất
          cat <<EOF > update.json
          {
            "version": "${{ env.VERSION }}",
            "url": "https://github.com/m3iK18dp/EveryThingDownloader-Tool/releases/download/${{ github.ref_name }}/EveryThingDownloader-Portable-${{ env.VERSION }}.exe",
            "changelog": "Phiên bản mới nhất ${{ github.ref_name }} đã được phát hành tự động. Xem chi tiết tại mục Releases trên GitHub."
          }
          EOF
          
          # 3. Cấu hình git agent và push
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update update.json to ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
