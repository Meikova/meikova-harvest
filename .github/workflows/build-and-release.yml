name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract version from tag
        shell: bash
        run: |
          TAG_NAME=${{ github.ref_name }}
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run build tool
        run: |
          python build_tool/builder_cli.py --target both --name EveryThingDownloader --version ${{ env.VERSION }} --company EveryThingDownloader --description EveryThingDownloader --copyright "© 2026 EveryThingDownloader" --obfuscate --pyarmor-level 2

      # =========================================================================
      # TÍNH TOÁN SHA-256 VÀ TỰ ĐỘNG TRÍCH XUẤT CHANGELOG ĐỂ TẠO RELEASE NOTES RIÊNG BIỆT
      # =========================================================================
      - name: Calculate SHA-256 & Generate Release Notes
        shell: bash
        run: |
          # 1. Tính toán mã băm SHA-256 của các tệp thực thi đã build
          PORTABLE_HASH=$(sha256sum "dist_electron/EveryThingDownloader-Portable-${{ env.VERSION }}.exe" | awk '{print $1}')
          SETUP_HASH=$(sha256sum "dist_electron/EveryThingDownloader Setup ${{ env.VERSION }}.exe" | awk '{print $1}')
          WEB_HASH=$(sha256sum "dist/EveryThingDownloader.exe" | awk '{print $1}')
          
          # 2. Lấy thông tin tin nhắn mô tả của tag (Tag Message) hoặc commit mới nhất
          TAG_MSG=$(git tag -l -n99 ${{ github.ref_name }} | sed "s/^${{ github.ref_name }} //g" | sed 's/^[ \t]*//')
          if [ -z "$TAG_MSG" ] || [ "$TAG_MSG" = "Release ${{ github.ref_name }}" ] || [ "$TAG_MSG" = "${{ github.ref_name }}" ]; then
            TAG_MSG=$(git log -1 --pretty=format:"%B")
          fi
          
          # 3. Lấy danh sách các commits (Changelog) giữa phiên bản cũ và phiên bản mới này
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..${{ github.ref_name }} --pretty=format:"* %s (%h)")
          else
            CHANGELOG=$(git log -n 15 --pretty=format:"* %s (%h)")
          fi
          
          # 4. Ghi nội dung động vào tệp release_notes.md
          cat <<EOF > release_notes.md
          # 🚀 EveryThingDownloader ${{ github.ref_name }}
          
          Giải pháp tải đa phương tiện toàn năng, bảo mật tối đa và tự động hóa phát hành vượt trội.
          
          ### 📝 Chi tiết phát hành (Release Message):
          $TAG_MSG
          
          ### 🔍 Nhật ký thay đổi (What's Changed):
          $CHANGELOG
          
          ### 📦 Thông tin các file cài đặt (Assets Info):
          * **EveryThingDownloader-Portable-${{ env.VERSION }}.exe**: Bản di động (Portable), chạy ngay không cần cài đặt (Khuyên dùng).
          * **EveryThingDownloader Setup ${{ env.VERSION }}.exe**: Bản cài đặt đầy đủ (Installer) hỗ trợ gỡ cài đặt tiện lợi.
          * **EveryThingDownloader.exe**: Bản Web Binary độc lập chạy trên trình duyệt web.
          
          ### 🛡️ Mã băm bảo mật (SHA-256 Checksums):
          | File Asset | SHA-256 Checksum |
          |---|---|
          | \`EveryThingDownloader-Portable-${{ env.VERSION }}.exe\` | \`${PORTABLE_HASH}\` |
          | \`EveryThingDownloader Setup ${{ env.VERSION }}.exe\` | \`${SETUP_HASH}\` |
          | \`EveryThingDownloader.exe\` | \`${WEB_HASH}\` |
          
          ---
          > ⚠️ **Lưu ý quan trọng**: Do mã nguồn được bảo vệ bằng các thuật toán xáo trộn code và đóng gói nhị phân (PyArmor), một số phần mềm diệt virus (bao gồm Windows Defender) có thể cảnh báo nhầm (False Positive). Hãy yên tâm bỏ qua hoặc thêm tệp vào danh sách loại trừ để sử dụng ổn định.
          EOF

      # =========================================================================
      # ĐẨY FILE EXE ĐÃ BUILD SANG KHO LƯU TRỮ RIÊNG TƯ (PRIVATE REPOSITORY)
      # =========================================================================
      - name: Create GitHub Release and Upload Assets (To Private Repo)
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/EveryThingDownloader.exe
            dist_electron/EveryThingDownloader-Portable-${{ env.VERSION }}.exe
            dist_electron/EveryThingDownloader Setup ${{ env.VERSION }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # ĐẨY FILE EXE ĐÃ BUILD SANG KHO LƯU TRỮ CÔNG KHAI (PUBLIC REPOSITORY)
      # =========================================================================
      - name: Create GitHub Release and Upload Assets (To Public Repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: m3iK18dp/EveryThingDownloader-Tool # Kho lưu trữ công khai của bạn
          token: ${{ secrets.RELEASE_TOKEN }}           # PAT cấu hình trong Secrets của Private Repo
          body_path: release_notes.md
          files: |
            dist/EveryThingDownloader.exe
            dist_electron/EveryThingDownloader-Portable-${{ env.VERSION }}.exe
            dist_electron/EveryThingDownloader Setup ${{ env.VERSION }}.exe
          draft: false
          prerelease: false

      # =========================================================================
      # CẬP NHẬT FILE update.json TRÊN KHO LƯU TRỮ CÔNG KHAI (PUBLIC REPOSITORY)
      # =========================================================================
      - name: Update update.json in Public Repo
        shell: bash
        run: |
          # 1. Clone repo công khai về thư mục tạm bằng PAT
          git clone https://x-token-auth:${{ secrets.RELEASE_TOKEN }}@github.com/m3iK18dp/EveryThingDownloader-Tool.git public_repo
          cd public_repo
          
          # 2. Ghi đè file update.json với thông tin mới nhất
          cat <<EOF > update.json
          {
            "version": "${{ env.VERSION }}",
            "url": "https://github.com/m3iK18dp/EveryThingDownloader-Tool/releases/download/${{ github.ref_name }}/EveryThingDownloader-Portable-${{ env.VERSION }}.exe",
            "changelog": "Phiên bản mới nhất ${{ github.ref_name }} đã được phát hành tự động. Xem chi tiết tại mục Releases trên GitHub."
          }
          EOF
          
          # 3. Cấu hình git agent và push
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update update.json to ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
