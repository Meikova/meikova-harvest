version: '3.8'

services:
  app:
    build: .
    container_name: meikova-harvest
    ports:
      - "${PORT:-18650}:18650"
    volumes:
      - ./downloads:/app/downloads
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_PORT=18650
      - AUTO_TUNNEL=${AUTO_TUNNEL:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18650/api/host-info"]
      interval: 30s
      timeout: 5s
      retries: 3

  builder:
    build: .
    container_name: meikova-harvest-builder
    ports:
      - "18651:18651"
    volumes:
      - .:/app
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_CONTAINER=1
    command: ["python", "build_tool/builder_cli.py", "--gui"]
