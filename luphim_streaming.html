    <script type="8b005ad668a4bd367eb087c5-text/javascript">
        if (localStorage.getItem(videoId)) {
            var popup = document.getElementById("popupResume");
            var btnResume = document.getElementById("btn-resume");
            var btnCancel = document.getElementById("btn-cancel");
            popup.style.display = "flex";
            btnResume.addEventListener("click", function () {
                var savedPosition = localStorage.getItem(videoId);
                myvideo.seek(savedPosition);
                localStorage.removeItem(videoId);
                popup.style.display = "none";
            });
            btnCancel.addEventListener("click", function () {
                localStorage.removeItem(videoId);
                popup.style.display = "none";
            });
        }

        if (!Phone()) {
            window.addEventListener("beforeunload", function () {
                SavePosition();
            });
        } else {
            setInterval(function () {
                SavePosition();
            }, 5000);
        }

        function SavePosition() {
            localStorage.removeItem(videoId);
            var currentPosition = myvideo.getPosition();
            localStorage.setItem(videoId, currentPosition);
        }
    </script>
    <!--RESET-->
    <script type="8b005ad668a4bd367eb087c5-text/javascript">
        if (!Phone()) {
            //Reset()
			setInterval(function () {
				$('#reset').html("")
				//Reset()
			}, 10000);
			function Reset() {
				var urlRESETSEGMENT = "https://reset.moviking.com/home/reset?videoId=" + videoId
				$.ajax({
					type: "GET",
					url: urlRESETSEGMENT,
					contentType: false,
					processData: false,
					success: function (data) {
						data.forEach(function (item) {
							var image = $('<img>');
							if (item.S3 == 1) {		
								var url = "https://" + item.cdn + "/s" + item.server + "/segment/" + item.videoId + "/" + item.ten
								if(item.server <= 4){
									url = url.replace("https://cdn.", "https://cdn2.")
								}
								if(item.server > 4){
									url = url.replace("https://cdn.", "https://cdn3.")
								}
								image.attr('src', url);
							} else {
								//image.attr('src', "https://" + item.cdn + "/segment/" + item.videoId + "/" + item.ten);
							}
							image.css('display', 'none');
							$('#reset').append(image);
						});
					},
					error: function (error) {

					}
				});
			}
        }
    </script>

        <script type="8b005ad668a4bd367eb087c5-text/javascript">
             var resultArrayJPG = [];
             var prevTime = 0;
             var firstTime = 0;
             const imgCreated = [];
             PreLoadJwplayer()
             getImagesByTime(myvideo.getPosition(), 1)
             setInterval(function () {
                 getImagesByTime(myvideo.getPosition(), 1)
             }, 5000);

             function PreLoadJwplayer() {
                 $.get(url, function (data) {
                     buildArrayContent(data)
                 });
             }

             function buildArrayContent(m3u8Content) {
                 const lines = m3u8Content.split('\n');
                 let totalDuration = 0;
                 for (let i = 0; i < lines.length; i++) {
                     if (lines[i].includes('#EXTINF:')) {
                         const duration = parseFloat(lines[i].split(':')[1].split(',')[0]);
                         totalDuration += duration;
                         var urlJpg = lines[i + 1].trim()
                         let lastSlashIndex = urlJpg.lastIndexOf('/');
                         let fileName = urlJpg.substring(lastSlashIndex + 1);
                         resultArrayJPG.push({
                             thoigian: totalDuration,
                             image: fileName
                         });
                     }
                 }
             }

             function getImagesByTime(inputTime, count = 1) {
                 const selectedImages = [];
                 for (let i = 0; i < resultArrayJPG.length; i++) {
                     if (resultArrayJPG[i].thoigian > inputTime) {
                         if (prevTime != inputTime || firstTime == 0) {
                             firstTime = 1
                             if (imgCreated.indexOf(resultArrayJPG[i].image) === -1) {
                                 prevTime = inputTime
                                 selectedImages.push(resultArrayJPG[i].image);
                             }
                             if (selectedImages.length === count) {
                                 selectedImages.forEach((image) => {
                                     SentData('https://reset.moviking.com/home/pushload/?videoId=' + videoId + "&numberJpg=" + resultArrayJPG[i].image)
                                     imgCreated.push(image);
                                 });
                                 break;
                             }
                         }
                     }
                 }
             }
        </script>
