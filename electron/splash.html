<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EveryThingDownloader – Starting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #0a0a0f;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* Animated gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(16, 16, 32, 1) 0%, #0a0a0f 100%);
      z-index: -1;
    }

    /* Grid lines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 32px;
      animation: floatIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .logo-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.4) 0%, transparent 70%);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .logo-img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 24px rgba(99,102,241,0.6));
    }

    .app-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5b4fc, #818cf8, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      animation: floatIn 0.8s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .tagline {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.5px;
      margin-bottom: 48px;
      animation: floatIn 0.8s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: floatIn 0.8s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .progress-bar-wrap {
      width: 280px;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa);
      width: 30%;
      animation: indeterminate 1.4s ease-in-out infinite;
      box-shadow: 0 0 16px rgba(99,102,241,0.8);
    }

    .status-text {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.3px;
    }

    .dots span {
      animation: blink 1.4s infinite;
      opacity: 0;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    .version-badge {
      position: fixed;
      bottom: 24px;
      right: 24px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.5px;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes indeterminate {
      0%   { left: -40%; width: 30%; }
      50%  { left: 30%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-glow"></div>
    <img class="logo-img" src="../static/logo.png" onerror="this.style.display='none'" alt="Logo"/>
  </div>

  <div class="app-name">EveryThingDownloader</div>
  <div class="tagline">EveryThingDownloader - Media Downloader</div>

  <div class="loader-container">
    <div class="progress-bar-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="status-text" id="statusText">
      Starting server<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  </div>

  <div class="version-badge" id="versionBadge">v2.0.1</div>

  <script>
    const statusMessages = [
      'Starting server',
      'Loading modules',
      'Initializing downloader',
      'Connecting services',
      'Preparing interface',
    ];
    let msgIdx = 0;
    const statusEl = document.getElementById('statusText');
    
    setInterval(() => {
      msgIdx = (msgIdx + 1) % statusMessages.length;
      statusEl.innerHTML = statusMessages[msgIdx] + '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
    }, 2000);

    if (window.electronAPI) {
      window.electronAPI.getAppVersion().then(v => {
        document.getElementById('versionBadge').textContent = 'v' + v;
      }).catch(() => {});
    }
  </script>
</body>
</html>
