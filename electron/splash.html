<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EveryThingDownloader – Starting...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      background: #080c14;
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* Ambient chamber lighting */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 70% 50% at 50% 30%, rgba(0, 229, 255, 0.12) 0%, transparent 65%),
        radial-gradient(ellipse 60% 70% at 50% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 70%);
      z-index: -1;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 28px;
      animation: floatIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .logo-glow {
      position: absolute;
      inset: -16px;
      border-radius: 28px;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.35) 0%, transparent 70%);
      animation: pulse-glow 2.4s ease-in-out infinite;
    }

    .logo-img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.45));
    }

    .app-name {
      font-family: 'Unbounded', sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: floatIn 0.8s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .app-name .infinity-mark {
      color: #00E5FF;
      font-weight: 400;
    }

    .tagline {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.3px;
      margin-bottom: 40px;
      animation: floatIn 0.8s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: floatIn 0.8s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .progress-bar-wrap {
      width: 280px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: #00E5FF;
      width: 35%;
      animation: indeterminate 1.4s ease-in-out infinite;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.9);
    }

    .status-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .dots span {
      animation: blink 1.4s infinite;
      opacity: 0;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    .version-badge {
      position: fixed;
      bottom: 20px;
      right: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(0, 229, 255, 0.5);
      letter-spacing: 0.8px;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.9; }
    }

    @keyframes indeterminate {
      0%   { left: -40%; width: 30%; }
      50%  { left: 30%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-glow"></div>
    <img class="logo-img" src="../static/logo.png" onerror="this.style.display='none'" alt="Logo"/>
  </div>

  <div class="app-name">EVERYTHING <span class="infinity-mark">∞</span> DOWNLOADER</div>
  <div class="tagline">Ambient Instrument Media Ingestion</div>

  <div class="loader-container">
    <div class="progress-bar-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="status-text" id="statusText">
      SYS // INITIALIZING<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  </div>

  <div class="version-badge" id="versionBadge">v2.0.3</div>

  <script>
    const statusMessages = [
      'SYS // STARTING SERVER',
      'SYS // LOADING ENGINES',
      'SYS // INITIALIZING INGESTION',
      'SYS // CONNECTING DAEMON',
      'SYS // PREPARING STAGE',
    ];
    let msgIdx = 0;
    const statusEl = document.getElementById('statusText');
    
    setInterval(() => {
      msgIdx = (msgIdx + 1) % statusMessages.length;
      statusEl.innerHTML = statusMessages[msgIdx] + '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
    }, 2000);

    if (window.electronAPI) {
      window.electronAPI.getAppVersion().then(v => {
        document.getElementById('versionBadge').textContent = 'v' + v;
      }).catch(() => {});
    }
  </script>
</body>
</html>
